name: 진(DJINN)-lite 일일 실행

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)
    - cron: "0 * * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 실행해볼 수 있게

permissions:
  contents: write  # state/ 파일 변경을 다시 커밋하기 위해 필요

concurrency:
  group: djinn-lite
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 진(DJINN)-lite 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          NEWSWIRE_RSS_URL: ${{ secrets.NEWSWIRE_RSS_URL }}
          KOREA_KR_MINISTRY_FILTER: ${{ vars.KOREA_KR_MINISTRY_FILTER }}
          SLACK_WORKSPACE: ${{ vars.SLACK_WORKSPACE }}
        run: python -m djinn_lite.main

      - name: 상태 파일과 페이지 커밋
        run: |
          git config user.name "djinn-lite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 진(DJINN)-lite 상태·페이지 업데이트 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "변경된 파일 없음 — 커밋 생략"
          fi

      - name: 상태 파일 변경사항 커밋
        run: |
          git config user.name "djinn-lite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 진(DJINN)-lite 상태 업데이트 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "변경된 상태 파일 없음 — 커밋 생략"
          fi

      - name: 기록 페이지 생성
        run: python -m djinn_lite.site

